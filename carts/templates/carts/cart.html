{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Giỏ hàng | FoodSmart</title>
 <link rel="stylesheet" href="{% static 'css/cart.css' %}">
</head>
<body>

<section class="cart">
  <h1>Giỏ hàng của bạn</h1>

  <div class="cart-wrapper">

    <!-- LEFT -->
    <div class="cart-left">

  <div class="cart-actions">
    <label class="select-all">
      <input type="checkbox" id="selectAll"
            onchange="toggleSelectAll(this.checked)">
      Chọn tất cả
    </label>

    <button class="clear-cart-btn" onclick="clearCart()">
      🗑 Xóa toàn bộ
    </button>
  </div>

    <div id="cartItems"></div>

    <div id="emptyCart"
        style="display:none; padding:40px; text-align:center; color:#888;">
      Giỏ hàng của bạn đang trống 🧺
    </div>

  </div>


    <!-- RIGHT -->
    <div class="cart-right">
      <h2>Tính Tổng</h2>

      <div class="row">
        <span>Tạm tính</span>
        <span id="subtotal">0đ</span>
      </div>

      <div class="row">
        <span>Vận chuyển</span>
        <span id="shipping">0đ</span>
      </div>

      <div class="row total">
        <span>Tổng cộng</span>
        <span id="total">0đ</span>
      </div>

      <button class="checkout" id="checkoutBtn">Thanh toán</button>
      <a href="../../users/templates/users/index.html" class="continue">← Tiếp tục mua sắm</a>
    </div>

  </div>
</section>

<script src="{% static 'js/cart.js' %}"></script>
</body>
</html>
