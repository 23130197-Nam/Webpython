<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Foodsart</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fdfbf0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .brand-logo {
            color: #4CAF50;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            color: #333;
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #4CAF50;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background-color: #45a049;
        }

        .secondary-action {
            text-align: center;
            margin-top: 20px;
        }

        .secondary-action a {
            color: #ff9800;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .secondary-action a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="brand-logo">Foodsmart</div>

        <div id="login-form">
            <h2>ĐĂNG NHẬP HỆ THỐNG</h2>
            <form>
                <div class="input-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" placeholder="Nhập tài khoản">
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" class="btn-login">ĐĂNG NHẬP NGAY</button>
            </form>
            <div class="secondary-action">
                <a href="javascript:void(0)" onclick="toggleForm('register')">Chưa có tài khoản? Đăng ký ngay</a>
            </div>
        </div>

        <div id="register-form" style="display: none;">
            <h2>TẠO TÀI KHOẢN MỚI</h2>
            <form id="form-register-act">
                <div class="input-group">
                    <label>Tên đăng nhập</label> <input type="text" id="reg-username"
                        placeholder="Nhập tên đăng nhập (viết liền)" required>
                </div>

                <div class="input-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="reg-phone" placeholder="Nhập số điện thoại" required>
                </div>

                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="reg-password" placeholder="Tạo mật khẩu" required>
                </div>

                <button type="submit" class="btn-login" style="background-color: #ff9800;">ĐĂNG KÝ</button>
            </form>

            <div class="secondary-action">
                <a href="javascript:void(0)" onclick="toggleForm('login')">Đã có tài khoản? Quay lại đăng nhập</a>
            </div>
        </div>
    </div>

    <script>
        function toggleForm(formType) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');

            if (formType === 'register') {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            } else {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            }
        }
    </script>

</body>
<script>
    // 1. Hàm lấy CSRF Token từ Cookie của Django
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
   document.querySelector('#login-form form').onsubmit = async (e) => {
    e.preventDefault();
    
    // Bạn phải lấy token này trước khi dùng ở header
    const csrftoken = getCookie('csrftoken'); 

    const data = {
        username: e.target.querySelector('input[type="text"]').value,
        password: e.target.querySelector('input[type="password"]').value
    };

    const response = await fetch('/api/users/login/', {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json', 
            'X-CSRFToken': csrftoken 
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();
    if (response.ok) {
        localStorage.setItem('access_token', result.access_token);
        window.location.href = '/api/users/trang-chu/';
    } else {
        alert(result.detail || "Đăng nhập thất bại");
    }
};

    // 2. Cập nhật lại hàm Fetch Đăng Ký
    document.getElementById('form-register-act').onsubmit = async (e) => {
        e.preventDefault();

        // Lấy token
        const csrftoken = getCookie('csrftoken');

        const data = {
            username: document.getElementById('reg-username').value,
            phone: document.getElementById('reg-phone').value,
            password: document.getElementById('reg-password').value
        };

        const response = await fetch('/api/users/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken // <--- THÊM DÒNG QUAN TRỌNG NÀY
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('Đăng ký thành công!');
            toggleForm('login');
        } else {
            const errors = await response.json();
            alert(JSON.stringify(errors));
        }
    };
</script>

</html>
